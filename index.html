<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="max-age=3600">
    <title>مدير الاستثمار العقاري — النسخة المحدثة</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="نظام إدارة الاستثمار العقاري الحديث والمتطور">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="مدير الاستثمار العقاري">
    
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
    
    <!-- Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
    
    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="brand">
                <div class="logo">🏛️</div>
                <h1>مدير الاستثمار العقاري — النسخة المحدثة</h1>
            </div>
            <div class="tools">
                <button class="btn btn-secondary" id="undoBtn" disabled>
                    <span>↪️</span>
                    <span>تراجع</span>
                </button>
                <button class="btn btn-secondary" id="redoBtn" disabled>
                    <span>↩️</span>
                    <span>تقدم</span>
                </button>
                <select class="select" id="themeSel">
                    <option value="dark">🌙 داكن</option>
                    <option value="light">☀️ فاتح</option>
                </select>
                <select class="select" id="fontSel">
                    <option value="14">خط 14</option>
                    <option value="16" selected>خط 16</option>
                    <option value="18">خط 18</option>
                </select>
                <button class="btn btn-secondary" id="lockBtn">
                    <span>🔒</span>
                    <span>قفل</span>
                </button>
            </div>
        </header>

        <!-- Main Layout -->
        <main class="main-layout">
            <!-- Sidebar Navigation -->
            <aside class="sidebar" id="tabs">
                <!-- Navigation will be rendered by JavaScript -->
            </aside>

            <!-- Main Content -->
            <section class="content" id="view">
                <!-- Content will be rendered by JavaScript -->
            </section>
        </main>
    </div>

    <!-- Service Worker Registration -->
    <script>
        // Define OBJECT_STORES globally before any other scripts
        window.OBJECT_STORES = [
            'customers', 'units', 'partners', 'unitPartners', 'contracts', 'installments',
            'partnerDebts', 'safes', 'transfers', 'auditLog', 'vouchers', 'brokerDues',
            'brokers', 'partnerGroups', 'settings', 'keyval'
        ];
        console.log('OBJECT_STORES defined:', window.OBJECT_STORES);
    </script>

    <!-- Main Application Script -->
    <script src="app.js"></script>
</body>
</html>
