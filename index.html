<style>
/* CSS مباشر للتأكد من التطبيق */
:root{
  --bg: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
  --panel: rgba(255, 255, 255, 0.05);
  --card: rgba(255, 255, 255, 0.08);
  --line: rgba(255, 255, 255, 0.1);
  --ink: #ffffff;
  --muted: rgba(255, 255, 255, 0.7);
  --brand: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  --ok: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
  --warn: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
  --gold: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
  --accent: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
  --shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
  --shadow-lg: 0 30px 60px rgba(0, 0, 0, 0.4);
  --border-radius: 16px;
  --border-radius-lg: 24px;
}

*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,Segoe UI,Roboto;font-weight:400;line-height:1.6}
.container{max-width:1400px;margin:0 auto;padding:24px;min-height:100vh}
.header{display:flex;gap:20px;align-items:center;justify-content:space-between;padding:20px 0;backdrop-filter:blur(20px);background:var(--panel);border-radius:var(--border-radius);margin-bottom:24px;box-shadow:var(--shadow)}
.brand{display:flex;gap:16px;align-items:center}
.logo{width:48px;height:48px;border-radius:var(--border-radius);background:var(--brand);display:grid;place-items:center;font-size:24px;box-shadow:var(--shadow);transition:transform 0.3s ease}
.logo:hover{transform:scale(1.1)}
h1{font-size:24px;margin:0;font-weight:600;background:var(--brand);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

.main-layout {
  display: flex;
  gap: 24px;
  margin-top: 0;
  align-items: flex-start;
  min-height: calc(100vh - 200px);
}

.sidebar {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 220px;
  flex-shrink: 0;
  backdrop-filter: blur(20px);
  background: var(--panel);
  border-radius: var(--border-radius);
  padding: 20px;
  box-shadow: var(--shadow);
  border: 1px solid var(--line);
}

.content {
  flex: 1;
  min-width: 0;
  backdrop-filter: blur(20px);
  background: var(--panel);
  border-radius: var(--border-radius);
  padding: 24px;
  box-shadow: var(--shadow);
  border: 1px solid var(--line);
}

.tab{
  width: 100%;
  padding: 16px 20px;
  border-radius: var(--border-radius);
  background: transparent;
  border: 1px solid transparent;
  color: var(--muted);
  cursor: pointer;
  text-align: right;
  font-size: 16px;
  font-weight: 500;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}
.tab:hover {
  background: var(--card);
  color: var(--ink);
  transform: translateX(-4px);
  box-shadow: var(--shadow);
}
.tab.active {
  background: var(--brand);
  color: white;
  box-shadow: var(--shadow);
  transform: translateX(-4px);
}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--border-radius);padding:24px;backdrop-filter:blur(20px);box-shadow:var(--shadow);transition:all 0.3s ease;position:relative;overflow:hidden}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--brand);border-radius:var(--border-radius) var(--border-radius) 0 0}

.btn{padding:16px 24px;border:none;border-radius:var(--border-radius);background:var(--brand);color:#fff;cursor:pointer;font-size:16px;font-weight:600;transition:all 0.3s ease;position:relative;overflow:hidden;backdrop-filter:blur(10px);box-shadow:var(--shadow)}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.btn.secondary{background:rgba(255,255,255,0.1);color:var(--ink);border:1px solid var(--line)}
.btn.secondary:hover{background:rgba(255,255,255,0.2)}

.table{width:100%;border-collapse:collapse;border-radius:var(--border-radius);overflow:hidden;background:var(--card);box-shadow:var(--shadow);backdrop-filter:blur(20px)}
.table th,.table td{padding:16px;border-bottom:1px solid var(--line);text-align:right;font-size:16px;transition:all 0.3s ease}
.table th{user-select:none;cursor:pointer;background:var(--panel);font-weight:600;color:var(--ink);position:relative}
.table th:hover{background:var(--card)}
.table tr:hover{background:rgba(255,255,255,0.05)}

.input,.select,textarea{width:100%;padding:16px;border-radius:var(--border-radius);border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;transition:all 0.3s ease;backdrop-filter:blur(10px)}
.input:focus,.select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(102, 126, 234, 0.1);transform:translateY(-2px)}

/* الثيم الفاتح */
:root[data-theme="light"]{
  --bg: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
  --panel: rgba(255, 255, 255, 0.9);
  --card: rgba(255, 255, 255, 0.95);
  --line: rgba(0, 0, 0, 0.1);
  --ink: #1a1a1a;
  --muted: rgba(0, 0, 0, 0.6);
  --brand: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  --ok: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
  --warn: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
  --gold: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
  --accent: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
  --shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 30px 60px rgba(0, 0, 0, 0.15);
}

/* الشريط السفلي */
.container > div:last-child {
  text-align: center;
  color: var(--muted);
  font-size: 14px;
  margin-top: 20px;
  padding: 16px;
  background: var(--card);
  border-radius: var(--border-radius);
  backdrop-filter: blur(20px);
  box-shadow: var(--shadow);
  border: 1px solid var(--line);
}

/* الأدوات */
.tools{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0;align-items:center}

/* الشارات */
.badge{padding:8px 16px;border-radius:999px;border:1px solid var(--line);font-size:14px;font-weight:500;backdrop-filter:blur(10px);transition:all 0.3s ease}
.badge:hover{transform:scale(1.05)}
.badge.ok{background:var(--ok);color:#fff;border:none;box-shadow:var(--shadow)}
.badge.info{background:var(--accent);color:#fff;border:none;box-shadow:var(--shadow)}
.badge.warn{background:var(--warn);color:#fff;border:none;box-shadow:var(--shadow)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin:20px 0}
.kpi-card{background:var(--card);border:1px solid var(--line);border-radius:var(--border-radius);padding:24px;backdrop-filter:blur(20px);box-shadow:var(--shadow);transition:all 0.3s ease;position:relative;overflow:hidden}
.kpi-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.kpi-card h3{margin:0 0 12px 0;color:var(--muted);font-size:16px;font-weight:500}
.kpi-card .big{font-size:32px;font-weight:700;background:var(--brand);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* الشبكة */
.grid{display:grid;gap:20px}
.grid-2{grid-template-columns:1fr 1fr}
.grid-3{grid-template-columns:repeat(3,1fr)}
.grid-4{grid-template-columns:repeat(4,1fr)}

/* البطاقات */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--border-radius);padding:20px;backdrop-filter:blur(20px);box-shadow:var(--shadow);transition:all 0.3s ease}
.panel:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.content > .panel:not(:last-child) {margin-bottom: 20px}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="brand"><div class="logo">🏛️</div><h1>مدير الاستثمار العقاري — النسخة النهائية</h1></div>
    <div class="tools">
      <button class="btn secondary" id="undoBtn" disabled>↪️ تراجع</button>
      <button class="btn secondary" id="redoBtn" disabled>↩️ تقدم</button>
      <select class="select" id="themeSel"><option value="dark">داكن</option><option value="light">فاتح</option></select>
      <select class="select" id="fontSel"><option value="14">خط 14</option><option value="16" selected>خط 16</option><option value="18">خط 18</option></select>
      <button class="btn secondary" id="lockBtn">🔒 قفل</button>
    </div>
  </div>
  <div class="main-layout">
    <div class="sidebar" id="tabs"></div>
    <div class="content" id="view"></div>
  </div>
  <div style="text-align:center;color:var(--muted);font-size:12px;margin-top:10px">💾 LocalStorage • PDF/CSV • بحث/فرز/تعديل مباشر • أقساط مرنة • عمولة/صيانة • تدفقات نقدية • فلاتر تاريخ للتقارير</div>
</div>

<script>
// Force complete cache clearing
(function() {
    // Clear all caches
    if ('caches' in window) {
        caches.keys().then(function(names) {
            names.forEach(function(name) {
                caches.delete(name);
            });
        });
    }
    
    // Force reload every time
    const timestamp = new Date().getTime();
    const currentUrl = window.location.href;
    if (currentUrl.indexOf('?') === -1) {
        window.location.href = currentUrl + '?t=' + timestamp;
    }
    
    // Disable browser back/forward cache
    window.addEventListener('pageshow', function(event) {
        if (event.persisted) {
            window.location.reload();
        }
    });
    
    // Force reload on focus
    window.addEventListener('focus', function() {
        window.location.reload();
    });
})();

// Define OBJECT_STORES globally before any other scripts
window.OBJECT_STORES = [
    'customers', 'units', 'partners', 'unitPartners', 'contracts', 'installments',
    'partnerDebts', 'safes', 'transfers', 'auditLog', 'vouchers', 'brokerDues',
    'brokers', 'partnerGroups', 'settings', 'keyval'
];
console.log('OBJECT_STORES defined:', window.OBJECT_STORES);
</script>
