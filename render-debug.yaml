services:
  - type: web
    name: estate-manager
    env: python
    buildCommand: pip install -r requirements-debug.txt
    startCommand: python backend/server_minimal.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true