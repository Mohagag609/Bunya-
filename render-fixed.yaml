services:
  - type: web
    name: estate-manager
    env: python
    buildCommand: pip install -r requirements-py311.txt
    startCommand: python backend/server_fixed.py
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: estate-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO