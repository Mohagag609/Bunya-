services:
  - type: web
    name: estate-management-neon
    env: node
    plan: free
    buildCommand: npm install && npm run migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_HOST
        value: ep-cool-breeze-adto11ap-pooler.c-2.us-east-1.aws.neon.tech
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: neondb
      - key: DB_USER
        value: neondb_owner
      - key: DB_PASSWORD
        value: npg_vq7uMlYPHi9s
      - key: DB_SSL
        value: true
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://estate-management-neon.onrender.com