version: '3.8'

services:
  # قاعدة البيانات PostgreSQL
  database:
    image: postgres:13
    container_name: real_estate_db
    environment:
      POSTGRES_DB: real_estate_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - real_estate_network

  # الخادم الخلفي Flask
  backend:
    build:
      context: .
      dockerfile: config/deployment/Dockerfile
    container_name: real_estate_backend
    environment:
      - FLASK_ENV=production
      - DATABASE_URL=postgresql://postgres:password@database:5432/real_estate_db
    ports:
      - "5000:5000"
    depends_on:
      - database
    volumes:
      - ./backend:/app/backend
      - ./config:/app/config
    networks:
      - real_estate_network

  # خادم الويب Nginx
  nginx:
    image: nginx:alpine
    container_name: real_estate_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/deployment/nginx.conf:/etc/nginx/nginx.conf
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - backend
    networks:
      - real_estate_network

  # Redis للتخزين المؤقت
  redis:
    image: redis:alpine
    container_name: real_estate_redis
    ports:
      - "6379:6379"
    networks:
      - real_estate_network

volumes:
  postgres_data:

networks:
  real_estate_network:
    driver: bridge