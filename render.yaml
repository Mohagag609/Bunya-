services:
  - type: web
    name: estate-manager-backend
    env: python
    region: oregon
    plan: free
    buildCommand: |
      cd backend
      pip install -r requirements.txt
    startCommand: |
      cd backend
      python server.py
    envVars:
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_mCShrFRbkc16@ep-small-salad-ad85fh4s-pooler.c-2.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: False
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /api/health

  - type: web
    name: estate-manager-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: |
      npm install
      npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://estate-manager-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html