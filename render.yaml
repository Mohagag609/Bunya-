services:
  - type: web
    name: real-estate-manager-modern
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m http.server 8000
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /health
    autoDeploy: true
    branch: main
    plan: free