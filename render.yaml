services:
  - type: web
    name: estate-manager-backend
    env: python
    region: oregon
    plan: free
    buildCommand: |
      cd backend
      pip install -r requirements.txt
    startCommand: |
      cd backend
      python server.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: estate-manager-db
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: False
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /api/health

  - type: web
    name: estate-manager-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: |
      npm install
      npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://estate-manager-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: estate-manager-db
    plan: free
    region: oregon