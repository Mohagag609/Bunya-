services:
  - type: web
    name: estate-manager
    env: python
    buildCommand: pip install -r requirements-py311.txt
    startCommand: gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT backend.server_production:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: estate-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_SOCKETIO_ASYNC_MODE
        value: threading