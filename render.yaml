services:
  # Backend API Service
  - type: web
    name: bunya
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        value: ep-nameless-wind-adg0hpra-pooler.c-2.us-east-1.aws.neon.tech
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: neondb
      - key: DB_USER
        value: neondb_owner
      - key: DB_PASSWORD
        value: npg_rSJl8TNn6QjO
      - key: JWT_SECRET
        value: estate-management-super-secret-key-2024
      - key: CORS_ORIGIN
        value: https://bunya.onrender.com

  # Frontend Static Site
  - type: web
    name: bunya-frontend
    env: static
    buildCommand: echo "Static site"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html