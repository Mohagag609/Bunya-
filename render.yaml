services:
  - type: web
    name: estate-manager
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend.server:app --config gunicorn.conf.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: estate-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0