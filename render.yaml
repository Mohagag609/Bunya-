services:
  - type: web
    name: estate-manager
    env: python
    buildCommand: pip install -r requirements-py311.txt
    startCommand: python backend/server_working.py
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: estate-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_SOCKETIO_ASYNC_MODE
        value: threading