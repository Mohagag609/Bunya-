services:
  - type: web
    name: estate-manager
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: ./simple_start.sh
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: SESSION_COOKIE_HTTPONLY
        value: true
      - key: SESSION_COOKIE_SAMESITE
        value: Lax
    healthCheckPath: /health

  - type: pserv
    name: estate-manager-db
    plan: free
    env: postgresql
    region: oregon