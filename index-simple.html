<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة العقارات</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2196F3">
    <meta name="description" content="نظام إدارة العقارات - إدارة العملاء والوحدات والعقود">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>🏠 نظام إدارة العقارات</h1>
      <div class="controls">
        <select id="themeSel">
          <option value="dark">🌙 داكن</option>
          <option value="light">☀️ فاتح</option>
        </select>
        <select id="fontSel">
          <option value="14">صغير</option>
          <option value="16">متوسط</option>
          <option value="18">كبير</option>
          <option value="20">أكبر</option>
        </select>
        <button id="lockBtn">🔒</button>
        <button id="undoBtn" disabled>↶</button>
        <button id="redoBtn" disabled>↷</button>
      </div>
    </header>
    <nav id="tabs" class="tabs"></nav>
    <div class="content" id="view"></div>
  </div>
  <div style="text-align:center;color:var(--muted);font-size:12px;margin-top:10px">💾 LocalStorage • PDF/CSV • بحث/فرز/تعديل مباشر • أقساط مرنة • عمولة/صيانة • تدفقات نقدية • فلاتر تاريخ للتقارير</div>

<script src="app-simple.js" defer></script>
</body>
</html>
