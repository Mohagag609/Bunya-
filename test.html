<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار البرنامج</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .btn { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .btn:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 10px; background: #f8f9fa; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>اختبار البرنامج</h1>
    <button class="btn" onclick="testAPI()">اختبار API</button>
    <button class="btn" onclick="testDatabase()">اختبار قاعدة البيانات</button>
    <div id="result" class="result"></div>

    <script>
        async function testAPI() {
            try {
                const response = await fetch('/api/data/customers');
                const data = await response.json();
                document.getElementById('result').innerHTML = '<h3>نتيجة API:</h3><pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('result').innerHTML = '<h3>خطأ في API:</h3><p>' + error.message + '</p>';
            }
        }

        async function testDatabase() {
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: 'admin', password: 'admin123' })
                });
                const data = await response.json();
                document.getElementById('result').innerHTML = '<h3>نتيجة قاعدة البيانات:</h3><pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('result').innerHTML = '<h3>خطأ في قاعدة البيانات:</h3><p>' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
