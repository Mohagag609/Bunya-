<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برنامج إدارة الاستثمار العقاري</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .header h1 {
            color: #2c3e50;
            font-size: 2.5rem;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .login-form {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e8ed;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .nav {
            display: none;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .nav-btn {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 12px 24px;
            margin: 5px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .nav-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .nav-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .main {
            display: none;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            min-height: 500px;
        }

        .user-info {
            display: none;
            align-items: center;
            gap: 15px;
        }

        .user-info span {
            font-weight: 600;
            color: #2c3e50;
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 14px;
            width: auto;
        }

        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .stat-card h3 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .table th,
        .table td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid #e9ecef;
        }

        .table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #495057;
        }

        .table tr:hover {
            background: #f8f9fa;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .login-form {
                padding: 20px;
            }
            
            .nav {
                padding: 15px;
            }
            
            .nav-btn {
                padding: 10px 16px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🏢 برنامج إدارة الاستثمار العقاري</h1>
            
            <!-- Login Form -->
            <div class="login-form" id="loginForm">
                <div class="form-group">
                    <label for="username">اسم المستخدم</label>
                    <input type="text" id="username" placeholder="أدخل اسم المستخدم" required>
                </div>
                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" placeholder="أدخل كلمة المرور" required>
                </div>
                <button class="btn" id="loginBtn">تسجيل الدخول</button>
            </div>

            <!-- User Info -->
            <div class="user-info" id="userInfo" style="display: none;">
                <span id="userName"></span>
                <button class="btn btn-sm" id="logoutBtn">تسجيل الخروج</button>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="nav" id="nav" style="display: none;">
            <button class="nav-btn active" data-view="dash">🏠 الرئيسية</button>
            <button class="nav-btn" data-view="customers">👥 العملاء</button>
            <button class="nav-btn" data-view="units">🏠 الوحدات</button>
            <button class="nav-btn" data-view="partners">🤝 الشركاء</button>
            <button class="nav-btn" data-view="contracts">📋 العقود</button>
            <button class="nav-btn" data-view="safes">💰 الخزن</button>
            <button class="nav-btn" data-view="vouchers">📄 السندات</button>
            <button class="nav-btn" data-view="reports">📊 التقارير</button>
        </nav>

        <!-- Main Content -->
        <main class="main" id="main" style="display: none;">
            <div id="view" class="view">
                <!-- Content will be loaded here -->
            </div>
        </main>

        <!-- Loading Spinner -->
        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>جاري التحميل...</p>
        </div>

        <!-- Error Message -->
        <div id="error" class="error" style="display: none;">
            <p id="errorMessage"></p>
            <button class="btn btn-sm" id="errorClose" style="margin-top: 10px;">إغلاق</button>
        </div>
    </div>

    <script>
        // API Client
        class EstateAPI {
            constructor() {
                this.baseURL = '/api';
                this.token = localStorage.getItem('authToken');
            }

            setToken(token) {
                this.token = token;
                if (token) {
                    localStorage.setItem('authToken', token);
                } else {
                    localStorage.removeItem('authToken');
                }
            }

            getHeaders() {
                const headers = {
                    'Content-Type': 'application/json'
                };
                if (this.token) {
                    headers['Authorization'] = `Bearer ${this.token}`;
                }
                return headers;
            }

            async request(endpoint, options = {}) {
                const url = `${this.baseURL}${endpoint}`;
                const config = {
                    headers: this.getHeaders(),
                    ...options
                };

                try {
                    const response = await fetch(url, config);
                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || `HTTP ${response.status}`);
                    }

                    return data;
                } catch (error) {
                    console.error('API Request failed:', error);
                    throw error;
                }
            }

            async login(username, password) {
                const data = await this.request('/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ username, password })
                });
                this.setToken(data.token);
                return data;
            }

            async logout() {
                this.setToken(null);
            }

            async getDashboard() {
                return await this.request('/reports/dashboard');
            }

            showError(message) {
                const errorDiv = document.getElementById('error');
                const errorMessage = document.getElementById('errorMessage');
                errorMessage.textContent = message;
                errorDiv.style.display = 'block';
            }

            hideError() {
                const errorDiv = document.getElementById('error');
                errorDiv.style.display = 'none';
            }

            showLoading() {
                const loadingDiv = document.getElementById('loading');
                loadingDiv.style.display = 'block';
            }

            hideLoading() {
                const loadingDiv = document.getElementById('loading');
                loadingDiv.style.display = 'none';
            }

            formatCurrency(amount) {
                return new Intl.NumberFormat('ar-EG', {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                }).format(amount) + ' ج.م';
            }
        }

        // Create global API instance
        const api = new EstateAPI();

        // Initialize application
        document.addEventListener('DOMContentLoaded', initializeApp);

        async function initializeApp() {
            try {
                // Check if user is already logged in
                if (api.token) {
                    try {
                        const profile = await api.getProfile();
                        showAuthenticatedUI(profile.user);
                    } catch (error) {
                        console.log('Token invalid, showing login form');
                        api.logout();
                        showLoginUI();
                    }
                } else {
                    showLoginUI();
                }

                setupEventListeners();
            } catch (error) {
                console.error('Failed to initialize app:', error);
                api.showError('فشل في تحميل التطبيق');
            }
        }

        function setupEventListeners() {
            // Login form
            document.getElementById('loginBtn').addEventListener('click', handleLogin);
            document.getElementById('password').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleLogin();
            });

            // Logout
            document.getElementById('logoutBtn').addEventListener('click', handleLogout);

            // Navigation
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const view = e.target.dataset.view;
                    if (view) {
                        navigateToView(view);
                    }
                });
            });

            // Error close
            document.getElementById('errorClose').addEventListener('click', () => {
                api.hideError();
            });
        }

        async function handleLogin() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!username || !password) {
                api.showError('الرجاء إدخال اسم المستخدم وكلمة المرور');
                return;
            }

            try {
                api.showLoading();
                const response = await api.login(username, password);
                showAuthenticatedUI(response.user);
                api.hideLoading();
            } catch (error) {
                api.hideLoading();
                api.showError('فشل في تسجيل الدخول: ' + error.message);
            }
        }

        async function handleLogout() {
            try {
                await api.logout();
                showLoginUI();
            } catch (error) {
                console.error('Logout error:', error);
                showLoginUI();
            }
        }

        function showLoginUI() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('userInfo').style.display = 'none';
            document.getElementById('nav').style.display = 'none';
            document.getElementById('main').style.display = 'none';
        }

        function showAuthenticatedUI(user) {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('userInfo').style.display = 'flex';
            document.getElementById('userName').textContent = user.fullName || user.username;
            document.getElementById('nav').style.display = 'flex';
            document.getElementById('main').style.display = 'block';
            
            // Load dashboard
            navigateToView('dash');
        }

        async function navigateToView(view) {
            try {
                // Update navigation
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                document.querySelector(`[data-view="${view}"]`).classList.add('active');

                api.showLoading();

                // Load view content
                switch (view) {
                    case 'dash':
                        await loadDashboard();
                        break;
                    default:
                        document.getElementById('view').innerHTML = `
                            <div style="text-align: center; padding: 40px;">
                                <h2>🚧 قيد التطوير</h2>
                                <p>هذه الصفحة قيد التطوير وسيتم إضافتها قريباً</p>
                            </div>
                        `;
                }

                api.hideLoading();
            } catch (error) {
                api.hideLoading();
                api.showError('فشل في تحميل الصفحة: ' + error.message);
            }
        }

        async function loadDashboard() {
            try {
                const data = await api.getDashboard();
                const { summary } = data;

                const html = `
                    <div class="dashboard">
                        <div class="stat-card">
                            <h3>👥 العملاء</h3>
                            <div class="stat-number">${summary.customersCount}</div>
                        </div>
                        <div class="stat-card">
                            <h3>🏠 الوحدات</h3>
                            <div class="stat-number">${summary.unitsCount}</div>
                        </div>
                        <div class="stat-card">
                            <h3>📋 العقود</h3>
                            <div class="stat-number">${summary.contractsCount}</div>
                        </div>
                        <div class="stat-card">
                            <h3>💰 إجمالي الإيرادات</h3>
                            <div class="stat-number">${api.formatCurrency(summary.totalRevenue)}</div>
                        </div>
                        <div class="stat-card">
                            <h3>🏦 رصيد الخزن</h3>
                            <div class="stat-number">${api.formatCurrency(summary.safesBalance)}</div>
                        </div>
                    </div>
                    <div style="text-align: center; margin-top: 40px;">
                        <h2>🎉 مرحباً بك في برنامج إدارة الاستثمار العقاري!</h2>
                        <p style="margin-top: 20px; color: #666;">
                            يمكنك الآن إدارة عملائك ووحداتك العقارية وعقودك بسهولة
                        </p>
                    </div>
                `;

                document.getElementById('view').innerHTML = html;
            } catch (error) {
                throw error;
            }
        }
    </script>
</body>
</html>
